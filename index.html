<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Team Hard → Método Acelera!</title>

  <!-- Redirecionamento automático em 6 segundos -->
  <meta http-equiv="refresh" content="6;url=https://metodoacelera.github.io/site/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #F97316;
      --orange-dark: #C2410C;
      --black: #0A0A0A;
      --white: #FAFAFA;
      --gray: #6B7280;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ---- NOISE TEXTURE ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ---- BACKGROUND GLOW ---- */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      animation: pulse-glow 6s ease-in-out infinite alternate;
    }
    .glow-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(249,115,22,.18), transparent 70%);
      top: -100px; left: -100px;
    }
    .glow-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(194,65,12,.12), transparent 70%);
      bottom: -80px; right: -80px;
      animation-delay: 3s;
    }
    @keyframes pulse-glow {
      from { opacity: .6; transform: scale(1); }
      to   { opacity: 1;  transform: scale(1.1); }
    }

    /* ---- LAYOUT ---- */
    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 0;
    }

    /* ---- BADGE ---- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(249,115,22,.12);
      border: 1px solid rgba(249,115,22,.3);
      color: var(--orange);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 32px;
      opacity: 0;
      animation: fade-up .6s ease forwards .2s;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: var(--orange);
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: .2; }
    }

    /* ---- OLD NAME ---- */
    .old-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 1;
      color: rgba(255,255,255,.18);
      letter-spacing: .04em;
      opacity: 0;
      animation: fade-up .6s ease forwards .4s;
      position: relative;
    }
    .old-name::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scaleX(0);
      width: 110%;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(249,115,22,.7), transparent);
      animation: strikethrough .5s ease forwards 1.2s;
      transform-origin: left center;
    }
    @keyframes strikethrough {
      from { transform: translate(-50%, -50%) scaleX(0); transform-origin: left center; }
      to   { transform: translate(-50%, -50%) scaleX(1); transform-origin: left center; }
    }

    /* ---- ARROW ---- */
    .arrow {
      font-size: 2rem;
      color: var(--orange);
      margin: 16px 0;
      opacity: 0;
      animation: fade-up .5s ease forwards .9s, bounce-arrow 1.5s ease-in-out infinite 1.5s;
    }
    @keyframes bounce-arrow {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* ---- NEW NAME ---- */
    .new-logo {
      width: clamp(220px, 55vw, 420px);
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0;
      animation: fade-up .7s ease forwards 1s, glow-logo 3s ease-in-out infinite 2s;
    }
    @keyframes glow-logo {
      0%,100% { filter: drop-shadow(0 0 20px rgba(249,115,22,0)); }
      50% { filter: drop-shadow(0 0 40px rgba(249,115,22,.4)); }
    }

    /* ---- TAGLINE ---- */
    .tagline {
      margin-top: 24px;
      font-size: clamp(.9rem, 2.5vw, 1.1rem);
      color: rgba(255,255,255,.5);
      line-height: 1.6;
      max-width: 420px;
      opacity: 0;
      animation: fade-up .6s ease forwards 1.3s;
    }
    .tagline strong {
      color: rgba(255,255,255,.85);
      font-weight: 700;
    }

    /* ---- PROGRESS BAR ---- */
    .progress-wrap {
      margin-top: 40px;
      width: 100%;
      max-width: 320px;
      opacity: 0;
      animation: fade-up .5s ease forwards 1.6s;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: .72rem;
      color: rgba(255,255,255,.35);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }
    .progress-track {
      height: 3px;
      background: rgba(255,255,255,.08);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orange-dark), var(--orange));
      border-radius: 9999px;
      animation: fill-bar 6s linear forwards 1.8s;
    }
    @keyframes fill-bar {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* ---- CTA BUTTON ---- */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      background: linear-gradient(135deg, #F97316, #C2410C);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      letter-spacing: .04em;
      padding: 14px 32px;
      border-radius: 9999px;
      text-decoration: none;
      opacity: 0;
      animation: fade-up .5s ease forwards 1.8s;
      transition: transform .2s ease, box-shadow .2s ease;
      position: relative;
      overflow: hidden;
    }
    .cta::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(249,115,22,.4); }
    .cta:hover::after { opacity: 1; }
    .cta svg { transition: transform .2s; }
    .cta:hover svg { transform: translateX(4px); }

    /* ---- FOOTER NOTE ---- */
    .note {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .7rem;
      color: rgba(255,255,255,.2);
      letter-spacing: .06em;
      white-space: nowrap;
      opacity: 0;
      animation: fade-up .5s ease forwards 2s;
    }

    /* ---- SHARED ANIMATION ---- */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- DIAGONAL LINE DECORATION ---- */
    .deco-line {
      position: fixed;
      pointer-events: none;
      opacity: .04;
    }
    .deco-line-1 {
      top: 0; left: 0;
      width: 2px; height: 100vh;
      background: linear-gradient(180deg, transparent, var(--orange), transparent);
      left: 15%;
    }
    .deco-line-2 {
      top: 0; right: 15%;
      width: 2px; height: 100vh;
      background: linear-gradient(180deg, transparent, var(--orange), transparent);
    }
    .deco-line-3 {
      top: 15%; left: 0;
      width: 100vw; height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
    }

  </style>
</head>
